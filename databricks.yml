bundle:
  name: factored-banking-cs

variables:
  source_prefix:
    description: Landing sub-folder to ingest (data | data_backup_20260831)
    default: data

resources:
  jobs:
    ingest_bronze:
      name: "[${bundle.target}] Ingest · S3 → Landing → Bronze"
      max_concurrent_runs: 1
      tasks:
        - task_key: landing_copy
          notebook_task:
            notebook_path: ./src/bronze/01_landing_copy.py
            base_parameters:
              tables: all
              source_prefix: ${var.source_prefix}
              max_workers: "32"
          max_retries: 2
          min_retry_interval_millis: 60000

        - task_key: bronze_autoloader
          depends_on:
            - task_key: landing_copy
          notebook_task:
            notebook_path: ./src/bronze/02_bronze_autoloader.py
            base_parameters:
              tables: all
              source_prefix: ${var.source_prefix}
          max_retries: 1

    build_silver:
      name: "[${bundle.target}] Silver · Bronze → typed, checked, merged"
      max_concurrent_runs: 1
      parameters:
        - name: tables
          default: all            # comma list or all (dependency order)
        - name: mode
          default: incremental    # incremental | full
      tasks:
        - task_key: silver_build
          notebook_task:
            notebook_path: ./src/silver/01_build_silver.py
            base_parameters:
              tables: "{{job.parameters.tables}}"
              mode: "{{job.parameters.mode}}"
              run_id: "{{job.run_id}}"
          max_retries: 1

        - task_key: update_fixture_test
          depends_on:
            - task_key: silver_build
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ./src/silver/02_update_fixture_test.py
            base_parameters:
              cleanup: "false"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-779a8237-d9dd.cloud.databricks.com
