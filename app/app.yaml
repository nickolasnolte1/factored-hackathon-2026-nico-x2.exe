# Databricks App configuration. `python -m app.bundle --out <dir>` copies this file to the root of the folder that is
# uploaded and deployed (see "Deploy as a Databricks App" in app/README.md). Paths are relative to that root.
command:
  - uvicorn
  - app.server:app
  - --host
  - 0.0.0.0
  - --port
  - $DATABRICKS_APP_PORT
  - --workers
  - "1"  # conversations live in memory: one process only

env:
  - name: BANK_TOOLS_ENV
    value: demo
  - name: BANK_TOOLS_REPOSITORY
    value: local
  - name: BANK_TOOLS_SNAPSHOT
    value: data/bank_tools/snapshot_panel.sqlite
  # The source folder is not meant for writes: cases, tickets and audit records go to /tmp and end with the instance.
  - name: APP_STORE
    value: /tmp/app_store.sqlite
  - name: BANK_TOOLS_AUDIT_DIR
    value: /tmp/expediente_audit
  - name: APP_DEMO_CONTROLS
    value: "1"
  - name: APP_LLM_ENDPOINT
    value: databricks-gpt-oss-120b
  - name: APP_LLM_TIMEOUT_S
    value: "30"
  - name: APP_MAX_TURNS
    value: "40"
  - name: APP_IDLE_MINUTES
    value: "60"
